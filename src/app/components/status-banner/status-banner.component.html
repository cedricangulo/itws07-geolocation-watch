<!--
  Legacy banner — IonToolbar styled as a glass pill.
  - Currently not rendered in HomePage (metrics live in PositionCard).
  - If reused, this markup keeps the toolbar semantics for accessibility.
-->
<ion-toolbar color="blue">
  <ion-title style="font-size: 0.8rem">
    Status: <ion-label color="orange">{{ status() }}</ion-label> <br />
    Distance: <ion-label color="orange">{{ distance().toFixed(2) }}m</ion-label>
  </ion-title>
</ion-toolbar>
