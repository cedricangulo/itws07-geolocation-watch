<!--
  Glass info card — single surface for position + address + tracking metrics.
  - Uses Ionic's IonCard for consistent theming, overridden to glass in SCSS.
  - aria-busy signals assistive tech that the card is in loading/skeleton state.
-->
<ion-card class="ion-padding" style="margin: 0" [attr.aria-busy]="(!position() || (position()!.lat === 0 && position()!.lng === 0)) ? 'true' : null">
  <!-- Loading skeleton: same height/layout as finished card to prevent CLS jump -->
  @if (!position() || (position()!.lat === 0 && position()!.lng === 0)) {
    <!-- aria-live polite announces the locating state without interrupting -->
    <div class="skeleton-wrap" aria-live="polite" aria-label="Locating position">
      <!-- Eyebrow placeholder + two line placeholders mimic the formatted coords -->
      <span class="sk-eyebrow shimmer"></span>
      <span class="sk-line sk-line--lg shimmer"></span>
      <span class="sk-line sk-line--md shimmer"></span>
      <!-- Divider + metric pills mirror the finished tracking row -->
      <div class="tracking-divider skeleton-divider"></div>
      <div class="tracking-row">
        <span class="tracking-item" data-label="Status"><span class="sk-pill shimmer"></span></span>
        <span class="tracking-item" data-label="Distance"><span class="sk-pill shimmer"></span></span>
      </div>
    </div>
  } @else {
    <!-- Finished state: eyebrow + clickable coords (Google Maps style) -->
    <ion-label class="pc-eyebrow">Current position</ion-label>
    <a
      class="pc-coords pc-coords--link"
      [attr.href]="mapsUrl() || null"
      target="_blank"
      rel="noopener"
      [attr.aria-label]="'Open ' + formatted() + ' in Maps'"
      >{{ formatted() }}</a
    >
    <!-- Reverse-geocoded address — clamped to 2 lines to keep card compact -->
    @if (displayName()) {
      <ion-label class="pc-address">{{ displayName() }}</ion-label>
    }
    <!-- Merged tracking metrics: rendered inside same card, not a separate banner -->
    @if (status() !== '' || distance() !== null) {
      <div class="tracking-divider"></div>
      <div class="tracking-row">
        <span class="tracking-item" data-label="Status"><ion-label color="orange">{{ status() || '—' }}</ion-label></span>
        <span class="tracking-item" data-label="Distance"><ion-label color="orange">{{ (distance() ?? 0).toFixed(2) }} m</ion-label></span>
      </div>
    }
  }
</ion-card>
